<title>The Quiet Page</title>

<style>

<script type="module">

  { n: "01", k: "Overview", title: "Monday morning at The Quiet Page", focus: "Platform", intro: true,

  const stroke = { vultr: "#3B82C4", box: "#C4402F", pos: "#E0A126" };
  let svg = `<svg class="arch" viewBox="0 0 640 ${top + 6 * G + H + 16}" role="img" aria-label="How one email flows through The Quiet Page">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8178"/></marker></defs>
    <line x1="58" y1="${y(0) + H / 2}" x2="58" y2="${y(6) + H / 2}" stroke="#4a4440" stroke-dasharray="3 4"/>
    <text x="58" y="${y(0) - 4}" text-anchor="middle" class="t-k">receipt</text>`;
  N.forEach(([t, sub, kind], i) => {
    svg += `<circle cx="58" cy="${y(i) + H / 2}" r="5" fill="#2e2b28" stroke="#8a8178"/><line x1="63" y1="${y(i) + H / 2}" x2="${X}" y2="${y(i) + H / 2}" stroke="#3a3633" stroke-dasharray="2 4"/>
      <rect x="${X}" y="${y(i)}" width="${W}" height="${H}" rx="12" fill="#262422" stroke="${stroke[kind] || "#4a4440"}" stroke-width="${kind ? 1.6 : 1}"/>
      <text x="${X + 16}" y="${y(i) + 22}" class="t-h">${esc(t)}</text><text x="${X + 16}" y="${y(i) + 40}" class="t-s">${esc(sub)}</text>`;
    if (i < N.length - 1) svg += `<line x1="${X + W / 2}" y1="${y(i) + H}" x2="${X + W / 2}" y2="${y(i + 1) - 3}" stroke="#8a8178" marker-end="url(#ah)"/>`;
  });
  const branch = (i, label, sub, col) => `<line x1="${X + W}" y1="${y(i) + H / 2}" x2="${X + W + 44}" y2="${y(i) + H / 2}" stroke="${col}" marker-end="url(#ah)"/>
    <rect x="${X + W + 48}" y="${y(i) + 4}" width="186" height="${H - 8}" rx="10" fill="none" stroke="${col}" stroke-dasharray="4 3"/>
    <text x="${X + W + 62}" y="${y(i) + 24}" class="t-h" fill="${col}">${label}</text><text x="${X + W + 62}" y="${y(i) + 40}" class="t-s">${sub}</text>`;
  svg += branch(2, "Quarantined", "Milo is never called", "#f08d7c") + branch(5, "Held for Mrs. Hart", "or blocked · no money moves", "#f0c56b") + `</svg>`;
  return `<div class="card archcard">${svg}</div>`;
}
function sideIntro(s) {
  if (s.n === "01") return `<div class="card"><h3>The rule of the house</h3>
    <table><tr><th style="width:42%">Code an agent writes</th><td>stays in the glass box</td></tr><tr><th>Money an agent moves</th><td>has to match the books</td></tr><tr><th>Anything that doesn't</th><td>waits for Mrs. Hart</td></tr></table></div>
    <div class="card" style="margin-top:14px"><div class="kicker">Book of the day</div><p style="margin:6px 0 0"><b>${esc(BOOK.t)}</b> by ${esc(BOOK.a)}: ${esc(BOOK.n)}. 10% off with any coffee.</p></div>`;
  if (s.arch) return `<div class="card"><h3>Where each piece runs</h3><table>
    <tr><th style="width:38%">Vultr VM</th><td>this page (FastAPI), the glass box (Docker + gVisor), the POS, the receipts</td></tr>
    <tr><th>Vultr Serverless Inference</th><td>Ivy and Milo, through an OpenAI-compatible API</td></tr>
    <tr><th>Braintree sandbox</th><td>${health?.rail === "braintree" ? "where approved refunds really execute" : "where approved refunds execute when configured; a simulated rail on this server"}</td></tr>
    <tr><th>Glass box limits</th><td>no network · read-only · 128 MB · 32 processes · 8 s · no capabilities · unprivileged user</td></tr>
    <tr><th>POS checks</th><td>order, owner, return record, amount vs record, amount vs Ivy's hand-off, currency, window, auto-refund limit, rail reconciliation</td></tr></table>
    <p class="muted" style="margin-top:10px">Neither boundary asks a model anything. That's why they hold when the models don't.</p></div>`;
  return `<div class="card muted">${s.n === "09" ? "Receipts are kept on the server for the last 200 runs." : "Use Next, or the numbers above, to move through the story."}</div>`;
}

async function runCase(id) {
  const btns = document.querySelectorAll("#text .btn"); btns.forEach((b) => (b.disabled = true));
  $("#side").innerHTML = `<div class="card muted">Running… a fresh container is starting.</div>`; drawPOS("check");
  try {
    const r = await fetch(`/api/run/${id}`, { method: "POST" }); const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    show(data);
  } catch (e) { $("#side").innerHTML = `<div class="card"><b>Couldn't run:</b> ${esc(e.message)}</div>`; }
  btns.forEach((b) => (b.disabled = false));
}
async function foolIt() {
  const body = { subject: $("#fSubject").value, body_text: $("#fBody").value, attachment_text: $("#fAttach").value };
  $("#foolBtn").disabled = true; $("#side").innerHTML = `<div class="card muted">Ivy is reading your email…</div>`; focus("OrderDesk");
  try {
    const r = await fetch("/api/fool-it", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json(); if (!r.ok) throw new Error(data.detail || r.statusText); foolResult(data);
  } catch (e) { $("#side").innerHTML = `<div class="card"><b>Couldn't run:</b> ${esc(e.message)}</div>`; }
  $("#foolBtn").disabled = false;
}
function foolResult(d) {
  lastReceipt = d.receipt; sceneState(d.outcome, d.steps);
  const money = d.steps.filter((st) => ["refund", "charge", "void"].includes(st.tool)), moved = money.filter((st) => st.decision === "PASS");
  const blocked = d.steps.filter((st) => st.decision === "BLOCK"), held = money.filter((st) => st.decision === "APPROVAL");
  const ho = (d.receipt.entries.find((e) => e.step === "reader") || {}).data?.handoff || {};
  let v, cls;
  if (d.outcome === "quarantined") { v = "Caught by the box"; cls = "v-quarantined"; }
  else if (moved.length) { const over = moved.some((st) => Number(st.args.amount) > 30 || (st.args.currency || "USD") !== "USD"); v = over ? "Money moved past the books" : "An honest refund went through"; cls = over ? "v-block" : "v-pass"; }
  else if (held.length) { v = "Held for Mrs. Hart · no money moved"; cls = "v-hold"; }
  else if (blocked.length) { v = "Blocked · no money moved"; cls = "v-block"; }
  else { v = "No money moved"; cls = "v-hold"; }
  focus(held.length ? "MrsHart" : money.length || blocked.length ? "Gate" : "Ivy");
  let h = `<div class="card"><span class="verdict ${cls}">${v}</span><p class="muted" style="margin-top:8px">${d.mode === "live" ? "Live run" : "Recorded run"} · ${esc(d.model)}</p>
    <div class="kicker" style="margin-top:12px">Ivy's hand-off</div><p class="diff" style="margin-top:6px">order ${esc(ho.siparis_no || "—")} · record ${esc(ho.iade_kaydi_no || "—")} · ${esc(ho.tutar || "—")} ${esc(ho.para_birimi || "")}</p>`;
  if (d.sandbox?.events?.length) h += `<p>The parser tried: ${d.sandbox.events.map((e) => `<span class="verdict v-block" style="padding:3px 9px">${esc(e)}</span>`).join(" ")}</p>`;
  for (const st of d.steps) {
    const reasons = (st.findings || []).map((f) => plainFinding(f.detail)).join("; ");
    h += `<div class="callrow"><code>${esc(st.tool)}</code> ${st.args.amount ? `<b>${esc(st.args.amount)} ${esc(st.args.currency || "")}</b>` : esc(st.args.order_no || "")}
      <span class="verdict ${st.decision === "PASS" ? "v-pass" : st.decision === "APPROVAL" ? "v-hold" : "v-block"}" style="padding:2px 9px">${st.decision === "APPROVAL" ? "held" : st.decision === "BLOCK" ? "blocked" : "passed"}</span>${reasons ? `<div class="why">${esc(reasons)}</div>` : ""}</div>`;
  }
  if (moved.length && d.rail_txns?.length) h += `<p class="muted" style="margin-top:8px">Braintree sandbox: ${d.rail_txns.map((t) => `${esc(t.kind)} <code>${esc(t.id || "?")}</code>`).join(", ")}</p>`;
  h += `<p class="muted" style="margin-top:12px">Edit the email and try again.</p></div>`;
  $("#side").innerHTML = h;
}
function show(d) {
  lastReceipt = d.receipt; sceneState(d.outcome, d.steps);
  const money = d.steps.find((s) => ["refund", "charge", "void"].includes(s.tool));
  let v, cls;
  if (d.outcome === "quarantined") { v = "Quarantined · the box caught it"; cls = "v-quarantined"; focus("SandboxBox"); }
  else if (money && money.decision === "PASS") { v = "Paid · Counterfoil approved it"; cls = "v-pass"; focus("Gate"); }
  else if (money && money.decision === "APPROVAL") { v = "Held for Mrs. Hart"; cls = "v-hold"; focus("Gate"); }
  else if (money && money.decision === "BLOCK") { v = "Blocked by the gate"; cls = "v-block"; focus("Gate"); }
  else { v = "No money moved"; cls = "v-hold"; }
  let h = `<div class="card"><div style="display:flex;gap:14px;align-items:flex-start"><img alt="Counterfoil POS screen" src="${posCanvas ? posCanvas.toDataURL() : ""}" style="width:96px;border-radius:10px;border:6px solid #2b2f2e;flex:none"><div><span class="verdict ${cls}">${v}</span><p class="muted" style="margin-top:8px">${d.mode === "live" ? "Live run" : "Recorded run"} · model: ${esc(d.model)}</p></div></div>`;
  if (d.sandbox) {
    const code = esc(d.sandbox.code || "").replace(/(urlopen|socket|os\.fork|os\.environ|bytearray\(10\*\*7\)|open\('\/job[^)]*\))/g, '<span class="hl">$1</span>');
    h += `<h3 style="margin-top:12px">The parser ${d.model.startsWith("none") ? "(drill code)" : "the model wrote"}</h3><pre>${code}</pre>`;
    h += `<p style="margin-top:8px">Sandbox: ${d.sandbox.events.length ? d.sandbox.events.map((e) => `<span class="verdict v-block" style="padding:3px 9px">${esc(e)}</span>`).join(" ") : '<span class="verdict v-pass" style="padding:3px 9px">clean</span>'} <span class="muted">· ${esc(d.sandbox.runtime)} · ${d.sandbox.duration_s}s</span></p>`;
    if (d.sandbox.output) h += `<p class="muted">Parser output: <code>${esc(JSON.stringify(d.sandbox.output))}</code></p>`;
  }
  const ho = (d.receipt.entries.find((e) => e.step === "reader") || {}).data?.handoff;
  if (ho) h += `<h3 style="margin-top:12px">Ivy's hand-off to Milo</h3><p class="diff">order ${esc(ho.siparis_no)} · ${esc(ho.istek)} · ${esc(ho.tutar)} ${esc(ho.para_birimi)}${ho.not ? ` · note: “${esc(ho.not.slice(0, 120))}”` : ""}</p>`;
  if (d.steps.length) {
    h += `<h3 style="margin-top:12px">Milo's calls at the gate</h3><table>${d.steps.map((s) => `<tr><td><code>${esc(s.tool)}</code>${s.args.amount ? " " + esc(s.args.amount) : ""}</td><td><b>${esc(s.decision)}</b></td><td class="muted">${s.findings.map((f) => esc(f.code + ": " + f.detail)).join("<br>")}</td></tr>`).join("")}</table>`;
  }
  if (d.outcome === "quarantined") h += `<p style="margin-top:10px"><b>Milo was never called.</b> Nothing reached the payment rail.</p>`;
  h += `<div class="actions"><button class="btn ghost small" onclick="document.querySelector('#steps button[data-i=\\'${STEPS.findIndex((x) => x.evidence)}\\']').click()">See the receipt ›</button></div></div>`;
  $("#side").innerHTML = h;
}

// ---------- boot ----------
Promise.all([fetch("/healthz").then((r) => r.json()), fetch("/api/cases").then((r) => r.json())]).then(([h, c]) => {
  health = h; mode = c.mode; c.cases.forEach((x) => (cases[x.id] = x));
  $("#modeTag").textContent = mode === "live" ? `live · ${c.model}` : "recorded runs · drills live";
  nav(); render();
}).catch(() => { $("#modeTag").textContent = "offline"; nav(); render(); });
addEventListener("keydown", (e) => { if (e.target.closest("input,textarea")) return; if (e.key === "ArrowRight") go(current + 1); if (e.key === "ArrowLeft") go(current - 1); });
</script>
